{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Detection - Fire Guard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        .btn-hidden {
            display: none !important;
        }

        .btn-show {
            display: inline-flex !important;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-gray-900 text-white p-4 flex items-center gap-4 shadow-md z-10 flex-shrink-0">
        <a href="{% url 'adminpanel:admin_dashboard' %}" class="text-gray-400 hover:text-white transition-colors"
            title="Back to Dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-orange-500">
            Live Fire Detection
        </h1>

        <!-- Live latency display -->
        <div class="ml-auto flex items-center gap-3 text-xs text-gray-400">
            <span>Latency: <strong id="stat-latency" class="text-white">—</strong></span>
            <span>Frames: <strong id="stat-frames" class="text-white">0</strong></span>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 p-6 flex flex-col items-center gap-5">

        <!-- Status badge -->
        <div id="status-badge"
            class="px-6 py-2 rounded-full font-medium flex items-center gap-3 shadow-sm text-sm bg-gray-200 text-gray-700 border border-gray-300">
            <div id="status-dot" class="w-3 h-3 rounded-full bg-gray-400"></div>
            <span id="status-text">Requesting Camera Access…</span>
        </div>

        <!-- Video wrapper -->
        <div id="video-wrapper"
            class="relative w-full max-w-4xl bg-black rounded-xl shadow-2xl border-4 border-gray-800">

            <!-- Spinner -->
            <div id="loading-overlay"
                class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-gray-900 rounded-lg">
                <svg class="animate-spin h-10 w-10 text-red-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                </svg>
                <p class="text-white font-medium">Initializing Camera…</p>
            </div>

            <!-- Live video -->
            <video id="live-video" autoplay playsinline muted class="w-full h-auto rounded-lg block"></video>

            <!-- Overlay canvas -->
            <canvas id="overlay-canvas" class="absolute top-0 left-0 w-full h-full rounded-lg"
                style="pointer-events:none; z-index:20;"></canvas>
        </div>

        <!-- Capture canvas (hidden) -->
        <canvas id="capture-canvas" style="display:none;"></canvas>

        <!-- Buttons -->
        <div class="flex gap-4">
            <button id="start-btn"
                class="btn-hidden bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-transform hover:scale-105 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 inline" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                        clip-rule="evenodd" />
                </svg>
                Start Detection
            </button>

            <button id="stop-btn"
                class="btn-hidden bg-gray-700 hover:bg-gray-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-transform hover:scale-105 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 inline" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z"
                        clip-rule="evenodd" />
                </svg>
                Stop Detection
            </button>
        </div>

        <p class="text-center text-xs text-gray-400 max-w-xl">
            Frames are sent as fast as the backend responds. Fire and smoke only.
        </p>
    </main>

    <script>
        // ── DOM ───────────────────────────────────────────────────────────────────
        const video = document.getElementById('live-video');
        const overlay = document.getElementById('overlay-canvas');
        const ctx = overlay.getContext('2d');
        const captureCanvas = document.getElementById('capture-canvas');
        const captureCtx = captureCanvas.getContext('2d', { willReadFrequently: true });
        const loadingOverlay = document.getElementById('loading-overlay');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusBadge = document.getElementById('status-badge');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const videoWrapper = document.getElementById('video-wrapper');
        const statLatency = document.getElementById('stat-latency');
        const statFrames = document.getElementById('stat-frames');

        // ── Config ────────────────────────────────────────────────────────────────
        // Smaller image = faster YOLO inference on localhost
        // 224px is the sweet spot — still enough detail for fire detection
        const CAPTURE_WIDTH = 224;
        const JPEG_QUALITY = 0.50;   // slightly higher quality helps with small paper flames
        const BOX_LINGER_MS = 800;

        // MAX_IN_FLIGHT = 2 means two requests can be in-flight at once.
        // As soon as one returns, a new one fires immediately.
        // This gives near-continuous detection with no idle gaps.
        const MAX_IN_FLIGHT = 2;

        // ── State ─────────────────────────────────────────────────────────────────
        let scaleX = 1, scaleY = 1;
        let detecting = false;
        let inFlight = 0;          // number of requests currently pending
        let frameCount = 0;
        let clearTimer = null;
        let latencies = [];
        let loopActive = false;      // controls the requestAnimationFrame loop

        // ── Button helpers ────────────────────────────────────────────────────────
        function showBtn(btn) { btn.classList.remove('btn-hidden'); btn.classList.add('btn-show'); }
        function hideBtn(btn) { btn.classList.remove('btn-show'); btn.classList.add('btn-hidden'); }

        // ── Status badge ──────────────────────────────────────────────────────────
        function setStatus(state, text) {
            statusText.textContent = text;
            const base = 'px-6 py-2 rounded-full font-medium flex items-center gap-3 shadow-sm text-sm border';
            const map = {
                idle: [base, 'bg-gray-200   text-gray-700   border-gray-300', 'w-3 h-3 rounded-full bg-gray-400'],
                pending: [base, 'bg-yellow-100 text-yellow-800 border-yellow-200', 'w-3 h-3 rounded-full bg-yellow-500 animate-pulse'],
                active: [base, 'bg-green-100  text-green-800  border-green-200', 'w-3 h-3 rounded-full bg-green-500 animate-pulse'],
                fire: [base, 'bg-red-100    text-red-800    border-red-300', 'w-3 h-3 rounded-full bg-red-500 animate-bounce'],
                smoke: [base, 'bg-orange-100 text-orange-800 border-orange-200', 'w-3 h-3 rounded-full bg-orange-400 animate-pulse'],
                error: [base, 'bg-red-100    text-red-800    border-red-300', 'w-3 h-3 rounded-full bg-red-500 animate-bounce'],
            };
            const [b, badge, dot] = map[state] || map.idle;
            statusBadge.className = b + ' ' + badge;
            statusDot.className = dot;
        }

        // ── Camera ────────────────────────────────────────────────────────────────
        async function initCamera() {
            try {
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                    });
                } catch {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 640 }, height: { ideal: 480 } }
                    });
                }
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                    const ratio = Math.min(1, CAPTURE_WIDTH / video.videoWidth);
                    captureCanvas.width = Math.round(video.videoWidth * ratio);
                    captureCanvas.height = Math.round(video.videoHeight * ratio);
                    scaleX = overlay.width / captureCanvas.width;
                    scaleY = overlay.height / captureCanvas.height;
                    loadingOverlay.remove();
                    showBtn(startBtn);
                    setStatus('pending', 'Camera Ready — Click Start');
                };
            } catch (err) {
                console.error(err);
                loadingOverlay.remove();
                setStatus('error', 'Camera access denied or unavailable');
            }
        }

        // ── Start / Stop ──────────────────────────────────────────────────────────
        function startDetection() {
            if (detecting) return;
            detecting = true;
            loopActive = true;
            hideBtn(startBtn);
            showBtn(stopBtn);
            setStatus('active', 'Monitoring…');
            // Kick off MAX_IN_FLIGHT parallel request chains immediately
            for (let i = 0; i < MAX_IN_FLIGHT; i++) sendFrame();
        }

        function stopDetection() {
            detecting = false;
            loopActive = false;
            clearTimeout(clearTimer);
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            videoWrapper.classList.remove('shadow-[0_0_50px_rgba(239,68,68,0.7)]');
            hideBtn(stopBtn);
            showBtn(startBtn);
            setStatus('pending', 'Detection Paused');
        }

        startBtn.addEventListener('click', startDetection);
        stopBtn.addEventListener('click', stopDetection);

        // ── Core loop — self-chaining, no setInterval ─────────────────────────────
        // Each call fires a request, awaits it, draws the result, then immediately
        // fires the next one. Two chains run in parallel (MAX_IN_FLIGHT = 2).
        // This means the backend is never idle — as soon as one response returns,
        // the next frame is already being captured and sent.
        async function sendFrame() {
            if (!detecting || !loopActive) return;

            // Snapshot the current live frame
            captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
            const b64 = captureCanvas.toDataURL('image/jpeg', JPEG_QUALITY);

            const t0 = performance.now();
            inFlight++;

            try {
                const res = await fetch("{% url 'adminpanel:process_live_frame' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ image: b64 })
                });

                // Track latency
                const ms = performance.now() - t0;
                latencies.push(ms);
                if (latencies.length > 10) latencies.shift();
                const avg = latencies.reduce((a, b) => a + b, 0) / latencies.length;
                statLatency.textContent = Math.round(avg) + ' ms';

                frameCount++;
                statFrames.textContent = frameCount;

                if (res.ok) {
                    const data = await res.json();
                    if (data.success && detecting) drawDetections(data.detections);
                }
            } catch (e) {
                console.error('sendFrame:', e);
            } finally {
                inFlight--;
                // Chain — immediately send the next frame so there is zero idle time
                if (detecting && loopActive) sendFrame();
            }
        }

        // ── Draw — fire & smoke only ──────────────────────────────────────────────
        function drawDetections(detections) {
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            let hasFire = false, hasSmoke = false;

            detections.forEach(det => {
                const lbl = det.label.toLowerCase();
                const isFire = lbl.includes('fire') || lbl === 'default'
                    || lbl.includes('burning') || lbl.includes('flames')
                    || lbl === 'fire/burning detected';
                const isSmoke = lbl.includes('smoke');
                if (!isFire && !isSmoke) return;

                if (isFire) hasFire = true;
                if (isSmoke) hasSmoke = true;

                let [x1, y1, x2, y2] = det.box;
                x1 = Math.round(x1 * scaleX); x2 = Math.round(x2 * scaleX);
                y1 = Math.round(y1 * scaleY); y2 = Math.round(y2 * scaleY);
                const bw = x2 - x1, bh = y2 - y1;

                const color = isFire ? '#ef4444' : '#fb923c';
                const dLabel = isFire ? 'Fire' : 'Smoke';
                const conf = `${dLabel} ${(det.conf * 100).toFixed(0)}%`;

                // Glow
                if (isFire) { ctx.shadowColor = 'rgba(239,68,68,0.55)'; ctx.shadowBlur = 18; }
                ctx.strokeStyle = color;
                ctx.lineWidth = isFire ? 4 : 2.5;
                ctx.strokeRect(x1, y1, bw, bh);
                ctx.shadowBlur = 0;

                // Corner reticle
                if (isFire) {
                    const cs = 16;
                    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
                    [[x1, y1, 1, 1], [x2, y1, -1, 1], [x1, y2, 1, -1], [x2, y2, -1, -1]].forEach(([cx, cy, dx, dy]) => {
                        ctx.beginPath();
                        ctx.moveTo(cx + dx * cs, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + dy * cs);
                        ctx.stroke();
                    });
                }

                // Label pill
                ctx.font = 'bold 17px Inter, sans-serif';
                const tw = ctx.measureText(conf).width;
                const pH = 26, pp = 9;
                const py = y1 > pH + 5 ? y1 - pH - 4 : y1 + 5;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(x1, py, tw + pp * 2, pH, 5) : ctx.rect(x1, py, tw + pp * 2, pH);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillText(conf, x1 + pp, py + pH - 6);
            });

            if (hasFire) {
                videoWrapper.classList.add('shadow-[0_0_50px_rgba(239,68,68,0.7)]');
                setStatus('fire', '🔥 WARNING: FIRE DETECTED!');
            } else if (hasSmoke) {
                videoWrapper.classList.remove('shadow-[0_0_50px_rgba(239,68,68,0.7)]');
                setStatus('smoke', '💨 SMOKE DETECTED!');
            } else {
                videoWrapper.classList.remove('shadow-[0_0_50px_rgba(239,68,68,0.7)]');
                if (detecting) setStatus('active', 'Monitoring…');
            }

            clearTimeout(clearTimer);
            clearTimer = setTimeout(() => {
                ctx.clearRect(0, 0, overlay.width, overlay.height);
                videoWrapper.classList.remove('shadow-[0_0_50px_rgba(239,68,68,0.7)]');
                if (detecting) setStatus('active', 'Monitoring…');
            }, BOX_LINGER_MS);
        }

        window.addEventListener('load', initCamera);
    </script>
</body>

</html>
