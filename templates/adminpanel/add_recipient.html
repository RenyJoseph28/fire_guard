{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Recipient - Fire Guard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 font-sans flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Add Alert Recipient</h2>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" name="name" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
            </div>

            <div class="flex items-center gap-3">
                <input type="checkbox" name="critical_only" id="critical_only"
                    class="w-5 h-5 text-brand-600 border-gray-300 rounded focus:ring-brand-500">
                <label for="critical_only" class="text-sm text-gray-700">Send <strong>Critical/High</strong> alerts
                    only</label>
            </div>
            <p class="text-xs text-gray-500 ml-8 -mt-4">If unchecked, they will receive all alerts (including
                Smoke/Medium)</p>

            <div class="pt-4 flex gap-4">
                <a href="{% url 'adminpanel:recipients_list' %}"
                    class="flex-1 py-3 text-center text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">Cancel</a>
                <button type="submit"
                    class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-bold shadow-md transition-all">Add
                    Recipient</button>
            </div>
        </form>
    </div>
</body>

</html>
