{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload for Analysis - Fire Guard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">
    <div class="w-full max-w-lg bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Upload Surveillance Video</h2>

        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <div
                class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:bg-gray-50 transition-colors cursor-pointer relative">
                <input type="file" name="video_file" accept="video/*"
                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                <div class="flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-400 mb-3" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p class="text-gray-600 font-medium">Click to upload or drag video here</p>
                    <p class="text-sm text-gray-400 mt-1">MP4, AVI, MOV supported</p>
                </div>
            </div>

            <!-- File Name Display -->
            <div id="file-name-display"
                class="hidden items-center justify-center gap-2 bg-blue-50 text-blue-700 p-3 rounded-lg border border-blue-100 font-medium text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="file-name-text"></span>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">
                Analyze Video
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'adminpanel:admin_dashboard' %}" class="text-gray-500 hover:text-gray-700 text-sm">Cancel
                and back to
                Dashboard</a>
        </div>
    </div>
    <!-- Preloader Overlay -->
    <div id="preloader"
        class="hidden fixed inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-50 transition-all">
        <div class="relative">
            <div class="animate-spin rounded-full h-20 w-20 border-t-4 border-b-4 border-blue-600"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <svg class="h-8 w-8 text-blue-600 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
        </div>
        <h3 class="text-2xl font-bold text-gray-800 mt-6 animate-pulse">Analyzing Video...</h3>
        <p class="text-gray-500 mt-2">Processing fire and smoke detection algorithms</p>
        <p class="text-xs text-gray-400 mt-1">Please do not close this window</p>
    </div>

    <script>
        const fileInput = document.querySelector('input[name="video_file"]');
        const fileNameDisplay = document.getElementById('file-name-display');
        const fileNameText = document.getElementById('file-name-text');
        const form = document.querySelector('form');
        const preloader = document.getElementById('preloader');

        // Show file name when selected
        fileInput.addEventListener('change', function () {
            if (this.files && this.files.length > 0) {
                fileNameText.textContent = "Selected File: " + this.files[0].name;
                fileNameDisplay.classList.remove('hidden');
                fileNameDisplay.classList.add('flex');
            } else {
                fileNameDisplay.classList.add('hidden');
            }
        });

        // Show preloader on submit
        form.addEventListener('submit', function (e) {
            // Check if file is selected
            if (fileInput.files.length === 0) {
                e.preventDefault();
                alert("Please select a video file first.");
                return;
            }
            preloader.classList.remove('hidden');
        });
    </script>
</body>

</html>
